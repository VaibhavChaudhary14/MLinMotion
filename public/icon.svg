<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Dark Bakelite substrate with crisp hairline border -->
  <rect x="1" y="1" width="30" height="30" rx="4" fill="#1A1715" stroke="#1A1715" stroke-width="2" />
  <!-- Reticle crosshair grid in warm parchment -->
  <line x1="1" y1="16" x2="31" y2="16" stroke="#FAF7F0" stroke-width="1.5" stroke-opacity="0.85" />
  <line x1="16" y1="1" x2="16" y2="31" stroke="#FAF7F0" stroke-width="1.5" stroke-opacity="0.85" />
  <!-- Secondary fine reticle tick marks -->
  <circle cx="16" cy="16" r="6" fill="none" stroke="#FAF7F0" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="2 2" />
  <!-- Bauhaus Vermilion active sensor block in top-right quadrant -->
  <rect x="19" y="5" width="8" height="8" fill="#C83226" rx="1.5" />
  <!-- Bauhaus Ultramarine anchor point in bottom-left quadrant -->
  <circle cx="10" cy="22" r="3" fill="#1848B8" />
</svg>
